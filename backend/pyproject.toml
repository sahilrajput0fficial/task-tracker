[project]
name = "task-tracker"
version = "0.1.0"
description = "User Management & Task Tracker API with JWT Authentication and Role-based Access"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "argon2-cffi>=25.1.0",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider -W ignore::DeprecationWarning"

[tool.ruff.lint]
ignore = ["B008"]

